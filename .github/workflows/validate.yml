name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - qa/validate-77d47c7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: 77d47c70daa96e51fd4b550b405787bbb3cba038

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate datasets and local links
        run: python scripts/validate_repository.py
